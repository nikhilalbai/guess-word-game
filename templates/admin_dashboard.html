{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">

        Admin Dashboard

    </h2>

    <div class="row">

        <div class="col-md-4 mb-3">

            <div class="card p-3 text-center">

                <h5>Total Users</h5>

                <h2>{{ total_users }}</h2>

            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card p-3 text-center">

                <h5>Total Games</h5>

                <h2>{{ total_games }}</h2>

            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card p-3 text-center">

                <h5>Games Today</h5>

                <h2>{{ games_today }}</h2>

            </div>

        </div>

        <div class="col-md-6 mb-3">

            <div class="card p-3 text-center">

                <h5>Total Wins</h5>

                <h2 class="text-success">

                    {{ total_wins }}

                </h2>

            </div>

        </div>

        <div class="col-md-6 mb-3">

            <div class="card p-3 text-center">

                <h5>Total Losses</h5>

                <h2 class="text-danger">

                    {{ total_losses }}

                </h2>

            </div>

        </div>

    </div>

</div>

<hr>

<div class="text-center">

    <a href="{{ url_for('admin.users') }}"
       class="btn btn-primary">

        <i class="bi bi-people-fill"></i>

        Manage Users

    </a>

</div>

<div class="text-center mt-3">

    <a href="{{ url_for('admin.games') }}"
       class="btn btn-success">

        <i class="bi bi-controller"></i>

        Manage Games

    </a>

</div>

{% endblock %}
